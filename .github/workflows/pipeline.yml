name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Automated Tests
      run: |
        python -m pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.SAHANALAKSHMI1 }}
        password: ${{ secrets.SAHANA18032007 }}

    - name: Generate Unique SHA Tag
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build Docker Image (Native)
      run: |
        docker build -t sahanalakshmi1/student-calc:${{ steps.vars.outputs.sha_short }} .

    - name: Push Docker Image (Native)
      run: |
        docker push sahanalakshmi1/student-calc:${{ steps.vars.outputs.sha_short }}

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

    - name: Dynamically Update Deployment Manifest Image Tag
      run: |
        sed -i "s|DOCKERHUB_USERNAME/student-calc:IMAGE_TAG|sahanalakshmi1/student-calc:${{ steps.vars.outputs.sha_short }}|g" k8s/deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
